name: Build and Commit Dist

on:
  push:
    branches:
      - design_tokens_teak

jobs:
  build-and-commit:
    if: "! contains(github.event.head_commit.message, 'CI: update dist')"
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Clean dist (ensure overwrite is deterministic)
        run: rm -rf dist

      - name: Build
        run: npm run build

      - name: Commit and push updated dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add dist

          if ! git diff --cached --quiet; then
            git commit -m "CI: update dist"
            git push
          else
            echo "No changes to commit"
          fi
